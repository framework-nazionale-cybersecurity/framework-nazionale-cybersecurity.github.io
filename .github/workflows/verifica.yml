name: Verifica

# Gira a ogni push e su ogni pull request. Non pubblica niente: serve solo a
# sapere che la build regge e che nessun URL storico e' andato perduto.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Versione fissata di proposito: e' la disciplina che accompagna la
          # scelta di Astro, per contenere il rischio di dependency rot.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Compila il sito
        run: npm run build

      - name: Collegamenti e immagini interni portano a qualcosa?
        # Ogni href e src che punta al sito stesso deve corrispondere a un file
        # della build. Intercetta il collegamento scritto male a mano, l'immagine
        # dimenticata fuori da public/, la pagina rinominata senza aggiornare chi
        # la cita. E' il controllo che sarebbe servito a scoprire subito il menu
        # inglese rotto e la favicon mancante dopo la prima pubblicazione.
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const esiste = (u) => {
              u = decodeURIComponent(u.split(/[?#]/)[0]);
              if (u === "/") return true;
              const p = path.join("dist", u);
              return fs.existsSync(p) || fs.existsSync(path.join(p.replace(/\/$/, ""), "index.html"));
            };
            const rotti = new Map();
            const giro = (d) => {
              for (const v of fs.readdirSync(d)) {
                const p = path.join(d, v);
                if (fs.statSync(p).isDirectory()) { giro(p); continue; }
                if (!v.endsWith(".html")) continue;
                const pagina = "/" + path.relative("dist", p).replace(/index\.html$/, "");
                for (const m of fs.readFileSync(p, "utf8").matchAll(/(?:href|src)="(\/[^"]*)"/g))
                  if (!esiste(m[1])) rotti.set(m[1], (rotti.get(m[1]) || new Set()).add(pagina));
              }
            };
            giro("dist");
            for (const [u, pagine] of rotti)
              console.log(`::error::${u} non esiste, citato da: ${[...pagine].slice(0, 5).join(" ")}`);
            console.log(`riferimenti interni rotti: ${rotti.size}`);
            process.exit(rotti.size ? 1 : 0);
          '

      - name: Conserva la build per l'anteprima privata
        uses: actions/upload-artifact@v4
        with:
          name: sito-${{ github.sha }}
          path: dist/
          retention-days: 14
